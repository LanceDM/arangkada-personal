# Builds the app and publishes it to GitHub Pages on every push to main.
#
# One-time setup in the repository (Settings):
#   - Pages > Build and deployment > Source: GitHub Actions
#   - Optional: Secrets and variables > Actions, VITE_FIREBASE_* (a variable
#     or a secret) to point the site at another Firebase project. Without
#     them it uses the study project's (sample-f7748) web config below: that
#     config ships inside every page anyway, it is not a password; Firestore
#     rules and Auth are what protect the data.
#   - Firebase console > Authentication > Settings > Authorized domains:
#     add <user>.github.io
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # A project site lives under /<repo>/.
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY || 'AIzaSyB2F07q9ducDStpaXTegtRpBasoLvxXv1k' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN || 'sample-f7748.firebaseapp.com' }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID || 'sample-f7748' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || secrets.VITE_FIREBASE_STORAGE_BUCKET || 'sample-f7748.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || '939775671070' }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID || '1:939775671070:web:84427a29f2e8ab49d9a70f' }}
          VITE_USE_FIREBASE_EMULATOR: 'false'
          VITE_ROUTING_SWITCH: new
          VITE_DATABASE_MODE: firestore
        run: |
          test -n "$VITE_FIREBASE_API_KEY" || { echo "::error::Set the VITE_FIREBASE_* repository variables first (see the top of this file)."; exit 1; }
          npm run build
          # Client-side routes: Pages serves 404.html for any unknown path, so
          # it is the app itself, and the router takes over from the URL.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
