# A participant reads only their own form answers.

query MyBackground @auth(level: USER) {
  backgroundResponses(where: { userUid: { eq_expr: "auth.uid" } }) {
    questionId
    formVersion
    answer
    answeredAt
  }
}

# Admin reads: only a token with the admin claim.

query ListParticipants @auth(expr: "auth.token.admin == true") {
  participants(orderBy: { code: ASC }) {
    code
    user { uid email }
    consentVersion
    consentedAt
    enrolledAt
    finishedAt
    note
  }
}

query ListRoleGrants @auth(expr: "auth.token.admin == true") {
  roleGrants(orderBy: { at: ASC }) {
    id
    user { uid email }
    role
    action
    by
    at
    reason
  }
}

query ListConfigVersions @auth(expr: "auth.token.admin == true") {
  configVersions(orderBy: { activeFrom: ASC }) {
    tag
    fingerprint
    config
    activeFrom
    activeTo
    note
  }
}

query ListBackgroundResponses @auth(expr: "auth.token.admin == true") {
  backgroundResponses {
    user { uid }
    questionId
    formVersion
    answer
    answeredAt
  }
}
